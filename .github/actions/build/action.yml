name: MSBuild
description: "Builds RememberLockpickAngle via its MSBuild scripts"
inputs:
  tag_name:
    description: "The name of the tag which triggered the action"
outputs:
  build-artifact-name:
    value: ${{env.PROJECT_NAME}}-${{inputs.ref_name}}

runs:
  using: "composite"
  steps:
    - name: setup-msbuild
      uses: microsoft/setup-msbuild@v3

    - name: Build
      shell: pwsh
      working-directory: ${{ env.GITHUB_WORKSPACE }}
      run: ./scripts/build.ps1

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: "${{ env.PROJECT_NAME }}-${{ inputs.tag_name }}"
        path: |
          ./x64/${{env.BUILD_CONFIGURATION}}/${{env.PROJECT_NAME}}.dll
          ./x64/${{env.BUILD_CONFIGURATION}}/${{env.PROJECT_NAME}}.pdb
          ./${{env.PROJECT_NAME}}.ini