name: MSBuild
description: "Builds RememberLockpickAngle via its MSBuild scripts"
outputs:
  build-artifact-name:
    value: ${{env.PROJECT_NAME}}-${{github.ref_name}}

runs:
  using: "composite"
  steps:
    - name: setup-msbuild
      uses: microsoft/setup-msbuild@v3

    - name: Build
      shell: pwsh
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: ./scripts/build.ps1

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: "${{env.PROJECT_NAME}}-${{github.ref_name}}"
        path: |
          ./x64/${{env.BUILD_CONFIGURATION}}/${{env.PROJECT_NAME}}.dll
          ./x64/${{env.BUILD_CONFIGURATION}}/${{env.PROJECT_NAME}}.pdb
          ./RememberLockpickAngle.ini