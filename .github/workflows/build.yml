name: "Build"
on:
  push:
    tags:
      - 'v*'

env:
  PROJECT_NAME: RememberLockpickAngle
  SOLUTION_FILE_PATH: ./deps/skse64/build
  BUILD_CONFIGURATION: Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      
      - name: Build
        id: build
        uses: "./.github/actions/build"
        with:
          tag_name: ${{ github.ref_name }}
      
    outputs:
      build-artifact-name: ${{ steps.build.outputs.build_artifact_name }}

  publish-release:
    runs-on: ubuntu-latest
    needs:
      - build
    permissions:
      contents: write
    if: github.event_name == 'push'
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.build-artifact-name }}
        
      - name: Create zip
        run: |
          mkdir -p SKSE/Plugins
          cp x64/${{ env.BUILD_CONFIGURATION }}/${{ env.PROJECT_NAME }}.dll SKSE/Plugins
          cp ${{ env.PROJECT_NAME }}.ini SKSE/Plugins
          zip -r ${{ needs.build.outputs.build-artifact-name }}.zip SKSE

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          name: Release ${{ github.ref_name }}
          files: ${{ env.PROJECT_NAME }} - ${{ github.ref_name }}.zip